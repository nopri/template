<div class='container pt-4 has-toolbar'>
  <div id='toolbar' 
       class='collapse d-block collapse bg-white toolbar'> 
    <div class='position-sticky'>
      <div class='list-group list-group-flush mx-3 mt-4'> 
        <a id='download' title='Download' href='#' 
          class='btn btn-floating btn-info'>
            <i class='fas fa-download'></i>
        </a>
      </div>
    </div>
  </div>
  <section>
    <div class="row">
      <div class="col-xl-4 col-sm-6 col-12 mb-4">
        <div class="card">
          <div class="card-body">
            <div class="d-flex justify-content-between px-md-1">
              <div class="align-self-center">
                <i class="fas fa-pencil-alt text-info fa-3x"></i>
              </div>
              <div class="text-end">
                <h3>8</h3>
                <p class="mb-0">Posts</p>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-xl-4 col-sm-6 col-12 mb-4">
        <div class="card">
          <div class="card-body">
            <div class="d-flex justify-content-between px-md-1">
              <div class="align-self-center">
                <i class="far fa-comment-alt text-warning fa-3x"></i>
              </div>
              <div class="text-end">
                <h3>9</h3>
                <p class="mb-0">Comments</p>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-xl-4 col-sm-6 col-12 mb-4">
        <div class="card">
          <div class="card-body">
            <div class="d-flex justify-content-between px-md-1">
              <div class="align-self-center">
                <i class="fas fa-chart-line text-success fa-3x"></i>
              </div>
              <div class="text-end">
                <h3>90 %</h3>
                <p class="mb-0">Rate</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class='table-responsive'>
          <table id='table' class='display cell-border'>
            <thead>
              <tr>
                <th></th>
                <th>Application</th>
                <th>Download</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>1</td>
                <td>A</td>
                <td>40</td>
              </tr>
              <tr>
                <td>2</td>
                <td>B</td>
                <td>50</td>
              </tr>
              <tr>
                <td>3</td>
                <td>C</td>
                <td>60</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="col-md-6">
        <div id='chart' style='width: 100%; min-height: 300px;'>
        </div>
      </div>
    </div>
  </section>
</div>
<script type='text/javascript'>
    var q = $.noConflict();
    q(document).ready(function() {
        q('#table').DataTable({
            scrollX: true,
            order: [[1, 'asc']],
            columnDefs: [
                {
                    targets: 0,
                    orderable: false,
                    render: DataTable.render.select()
                }
            ],
            select: {
                style: 'multi',
                selector: 'td:first-child'
            }
        });

        var c = echarts.init(document.getElementById('chart'));
        var o = {
            title: {
                text: 'Chart',
                left: 'center'
            },
            tooltip: {
                trigger: 'item'
            },
            legend: {
                orient: 'vertical',
                left: 'left'
            },
            series: [
                {
                    name: 'data',
                    type: 'pie',
                    data: [
                        {value: 40, name: 'A'},
                        {value: 50, name: 'B'},
                        {value: 60, name: 'C'}
                    ]
                }
            ]
        };
        c.setOption(o);
    });
</script>
