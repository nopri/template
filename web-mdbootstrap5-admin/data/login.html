<div class="container pt-4">
    $v["error"]$
    <form action='login.web' method='post'>
        <div class='form-outline mb-4' data-mdb-input-init>
            <input type='text' id='u' name='u' class='form-control' autofocus>
            <label class='form-label' for='u'>Username</label>
        </div>
        <div class='form-outline mb-4' data-mdb-input-init>
            <input type='password' id='p' name='p' class='form-control'>
            <label class='form-label' for='p'>Password</label>
        </div>
        <button type='submit' class='btn btn-primary btn-block' data-mdb-ripple-init>Login</button>
    </form>
</div>
