    <div class="row">
      <div class="col-xl-4 col-sm-6 col-12 mb-4">
        <div class="card" style='height: 120px;'>
          <div class="card-body">
            <div class="d-flex justify-content-between px-md-1">
              <div class="align-self-center">
                <img class='img-fluid' 
                    style='height: 96px' 
                    src='$v["qr"]$'>
              </div>
              <div class="text-end">
                <h3>QR</h3>
                <p class="mb-0">Code</p>
                <p class="mb-0 small">$v["text"]$</p>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-xl-4 col-sm-6 col-12 mb-4">
        <div class="card" style='height: 120px;'>
          <div class="card-body">
            <div class="d-flex justify-content-between px-md-1">
              <div class="align-self-center">
                <i class="bi bi-chat text-warning fs-2"></i>
              </div>
              <div class="text-end">
                <h3>9</h3>
                <p class="mb-0">Comments</p>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-xl-4 col-sm-6 col-12 mb-4">
        <div class="card" style='height: 120px;'>
          <div class="card-body">
            <div class="d-flex justify-content-between px-md-1">
              <div class="align-self-center">
                <i class="bi bi-graph-up text-success fs-2"></i>
              </div>
              <div class="text-end">
                <h3>90 %</h3>

              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class='table-responsive p-2'>
          <table id='table' class='table table-striped table-bordered'>
            <thead>
              <tr>
                <th></th>
                <th>Application</th>
                <th>Download</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>1</td>
                <td>A</td>
                <td>40</td>
              </tr>
              <tr>
                <td>2</td>
                <td>B</td>
                <td>50</td>
              </tr>
              <tr>
                <td>3</td>
                <td>C</td>
                <td>60</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="col-md-6">
        <div id='chart' style='width: 100%; min-height: 300px;'>
        </div>
      </div>
    </div>
<script type='text/javascript'>
    var q = $.noConflict();
    q(document).ready(function() {
        q('#table').DataTable({
            order: [[1, 'asc']],
            columnDefs: [
                {
                    targets: 0,
                    orderable: false,
                    render: DataTable.render.select()
                }
            ],
            layout: {
                top: {
                    buttons: [
                        {
                            extend: 'copy',
                            text: 'copy',
                            className: 'btn btn-sm btn-primary',
                            init: function (api, node, config) {
                                q(node).removeClass('dt-button');
                            },
                        },
                        {
                            extend: 'print',
                            text: 'print',
                            className: 'btn btn-sm btn-primary',
                            init: function (api, node, config) {
                                q(node).removeClass('dt-button');
                            },
                        },
                        {
                            text: 'custom',
                            className: 'btn btn-sm btn-primary',
                            init: function (api, node, config) {
                                q(node).removeClass('dt-button');
                            },
                            action: function (e, dt, node, config) {
                                var r = dt.rows({selected: true}).data();
                                if (r.length == 0) {
                                    alert('No rows selected');
                                } else {
                                    for (var i=0; i<r.length; i++) {
                                        alert(JSON.stringify(r[i]));
                                    }
                                }
                            }
                        }
                    ]
                }
            },
            select: {
                style: 'multi',
                selector: 'td:first-child'
            }
        });

        var c = echarts.init(document.getElementById('chart'));
        var o = {
            animation: false,
            title: {
                text: 'Chart',
                left: 'center'
            },
            tooltip: {
                trigger: 'item'
            },
            legend: {
                orient: 'vertical',
                left: 'left'
            },
            series: [
                {
                    name: 'data',
                    type: 'pie',
                    data: [
                        {value: 40, name: 'A'},
                        {value: 50, name: 'B'},
                        {value: 60, name: 'C'}
                    ]
                }
            ]
        };
        c.setOption(o);
    });
</script>
