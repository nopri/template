<div>
    <div class='login-box'>
        <div class='card'>
            <div class='card-body login-card-body rounded'>
                <p id='msg' class='login-box-msg text-danger'>
                </p>
                <form id='password' action='password.web' method='post'>
                    <div class='mb-4'>
                        <label for='p' class='form-label fw-semibold'>
                            Current password
                        </label>
                        <input type='password' id='p' name='p' 
                            class='form-control' 
                            placeholder='Enter your password'>
                        <div class='invalid-feedback'>
                            Please enter your current password
                        </div>                        
                    </div>
                    <div class='mb-4'>
                        <div class='d-flex 
                            justify-content-between
                            align-items-center
                            mb-2'>
                            <label for='n' class='form-label 
                                fw-semibold mb-0'>
                                New password
                            </label>
                            <a href='#' id='toggle'
                                class='text-decoration-none'>
                                show
                            </a>
                        </div>
                        <input type='password' id='n' name='n' 
                            class='form-control' 
                            placeholder='Enter a new password'>
                        <div class='invalid-feedback'>
                            Please enter a valid password
                        </div>       
                    </div>
                    <div class='form-text text-muted mb-4'>
                        Use at least 6 characters, including uppercase and lowercase letters, a number, and a symbol
                    </div>
                    <button type='submit' class='btn btn-primary w-100'>Save</button>
                </form>
            </div>
        </div>
    </div>
</div>
<script>
    var q = jQuery.noConflict();
    q(document).ready(function() {
        var r = new RegExp(
            '^(?=.*[A-Z])(?=.*[a-z])(?=.*\\d)(?=.*[^A-Za-z0-9]).{6,}' + String.fromCharCode(36)
        );

        function isValidPassword(x) {
            var v = x.val();
            if (!r.test(v)) {
                x.addClass('is-invalid');
                return [false, v];
            }
            x.removeClass('is-invalid');
            return [true, v];
        }

        function checkPassword() {
            isValidPassword(q(this));
        }
        
        q('#p').on('blur', checkPassword);
        q('#n').on('blur', checkPassword);

        q('#password').on('submit', function(e) {
            q('#msg').text('');
            e.preventDefault();

            var vp = isValidPassword(q('#p'));
            var vn = isValidPassword(q('#n'));

            if (!vp[0] || !vn[0]) {
                return false;
            }
            
            q.ajax({
                url: 'password.web',
                type: 'POST',
                data: {
                    p: vp[1],
                    n: vn[1]
                },
                dataType: 'json',
                success: function(res) {
                    q('#msg').text(res.status);
                },
                error: function(res, status, error) {
                    q('#msg').text('Error processing request');
                }
            });

        });

        q('#toggle').on('click', function(e) {
            e.preventDefault();

            var n = q('#n');
            var v = n.attr('type') === 'text';
            n.attr('type', v? 'password': 'text');
            q(this).text(v? 'show': 'hide');
        });
    });     
</script>
