<div>
    <div class='login-box'>
        <div class='login-logo'>
            <h3>Logo</h3>
        </div>
        <div class='card'>
            <div class='card-body login-card-body rounded'>
                <p class='login-box-msg text-danger'>$v["error"]$</p>
                <form action='login.web' method='post'>
                    <div class='mb-4'>
                        <input type='text' id='u' name='u' class='form-control' placeholder='Username' autofocus>
                    </div>
                    <div class='mb-4'>
                        <input type='password' id='p' name='p' class='form-control' placeholder='Password'>
                    </div>
                    <button type='submit' class='btn btn-primary w-100'>Login</button>
                </form>
            </div>
        </div>
    </div>
</div>
