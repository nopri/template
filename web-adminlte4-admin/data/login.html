    <div class='login-box'>
        <div class='login-logo'>
            <h3>$app_name$</h3>
        </div>
        <div class='card'>
            <div class='card-body login-card-body rounded'>
                <p id='msg' class='login-box-msg text-danger'>
                $v["error"]$
                </p>
                <form id='login' action='login.web' method='post'>
                    <div class='mb-4'>
                        <label for='u' class='form-label fw-semibold'>
                            Username
                        </label>
                        <input type='text' id='u' name='u' 
                            class='form-control' 
                            placeholder='Enter your username' 
                            autofocus>
                    </div>
                    <div class='mb-4'>
                        <label for='p' class='form-label fw-semibold'>
                            Password
                        </label>
                        <input type='password' id='p' name='p' 
                            class='form-control' 
                            placeholder='Enter your password'>
                    </div>
                    <button type='submit' class='btn btn-primary w-100'>
                        Login
                    </button>
                </form>
            </div>
        </div>
    </div>
<script>
    var q = jQuery.noConflict();
    q(document).ready(function() {
        q('#login').on('submit', function(e) {
            var u = q.trim(q('#u').val());
            var p = q.trim(q('#p').val());

            if ((u == '') || (p == '')) {
                e.preventDefault();
                q('#msg').text('Please enter your username and password');
                q('#u').focus();
            } else {
                q('#msg').text('Please wait...');
            }
        });
    });     
</script>
